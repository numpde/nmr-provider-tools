[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mock-numpy"
version = "0.1.0"
description = "Array operations stand-in for the provider examples"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["mock_numpy"]
namespaces = false

[tool.setuptools]
include-package-data = false

[tool.provider-tools]
type-requirements = "src/mock_numpy/_type_requirements.py"
