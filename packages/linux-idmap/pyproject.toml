[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-idmap"
version = "0.3.0a5"
description = "Read Linux process ID maps and observe host IDs for local Docker images"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
linux-idmap-probe = "linux_idmap._cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["linux_idmap", "linux_idmap.*"]
namespaces = false

[tool.setuptools]
include-package-data = false

[tool.ruff]
target-version = "py311"
