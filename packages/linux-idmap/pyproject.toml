[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-idmap"
version = "0.3.0a1"
description = "Host-relative Linux process maps with explicit Docker probe add-ons"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
linux-idmap-probe = "linux_idmap.addons.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["linux_idmap", "linux_idmap.*"]
namespaces = false

[tool.setuptools]
include-package-data = false
