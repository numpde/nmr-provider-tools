[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "provider-core"
version = "0.5.6"
description = "Contained NMR API provider operations and recovery"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
api = ["cryptography==50.0.0", "http-sf==1.2.1", "httpx==0.28.1", "httpcore==1.0.9", "h11==0.16.0", "tomli-w==1.2.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["provider_core", "provider_core.*"]
namespaces = false

[tool.setuptools]
include-package-data = false
