    .command { margin: 12px 0; }
    code { overflow-wrap: anywhere; font-size: 12px; }

<script>
  const report = JSON.parse(document.getElementById("results").textContent);
  const main = document.querySelector("main");
  const format = number => number.toLocaleString("en-GB");
  const outcomes = {"passed": "pass", "failed": "fail", "error": "fail",
    "unexpected success": "fail", "skipped": "skip", "expected failure": "skip"};

  function element(tag, text, className) {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    if (className) node.className = className;
    return node;
  }

  function bar(counts, description) {
    const node = element("div", undefined, "bar");
    node.setAttribute("role", "img");
    node.setAttribute("aria-label", description);
    for (const [status, count] of Object.entries(counts)) {
      if (!count) continue;
      const segment = element("span", undefined, status);
      segment.style.flex = count;
      node.append(segment);
    }
    return node;
  }

  const counts = Object.fromEntries(Object.keys(outcomes).map(outcome => [outcome, 0]));
  const modules = new Map();
  for (const [id, check] of Object.entries(report.checks)) {
    const outcome = check.outcome;
    counts[outcome]++;
    const moduleName = id.split(".").slice(0, -2).join(".") || id;
    if (!modules.has(moduleName)) modules.set(moduleName, []);
    modules.get(moduleName).push({id, ...check});
  }
  const findingCount = checks => checks.reduce((total, check) => total + (check.findings ?? 0), 0);

  const created = new Date(report.created).toLocaleString("en-GB");
  let selection = report.pattern === "test*.py" ? "" : ` TEST_PATTERN=${report.pattern}`;
  if (report.sourceRoot !== undefined) {
    const quote = text => "'" + text.replaceAll("'", "'\\''") + "'";
    selection += ` CHECK_SOURCE_ROOT=${quote(report.sourceRoot)} CHECK_SOURCE_FILES=${quote(report.sourceFiles.join(" "))}`;
  }
  const command = element("p", undefined, "command");
  command.append(element("code", `make tests/repository/quality/report DOCKER_CONTEXT=${report.context} PRIVACY_TESTS=${Number(report.privacyTests)}${selection} > notes/092_repo_checks_status.html`));
  main.append(command);
  main.append(element("p", `${created} · ${report.revision} · Docker: ${report.context} · Privacy tests: ${report.privacyTests ? "on" : "off"} · Selection: ${report.pattern}`, "meta"));
  const totals = element("div", undefined, "totals");
  const findings = element("span");
  findings.append(element("strong", format(findingCount(Object.values(report.checks)))), " reported findings");
  totals.append(findings);
  for (const [name, count] of Object.entries(counts)) {
    if (!count) continue;
    const total = element("span");
    total.append(element("i", undefined, outcomes[name]), element("strong", format(count)), ` ${name} checks`);
    totals.append(total);
  }
  const summary = Object.entries(counts).filter(([, count]) => count)
    .map(([name, count]) => `${format(count)} ${name}`).join(", ") || "No checks discovered";
  const segments = {pass: 0, fail: 0, skip: 0};
  for (const [outcome, count] of Object.entries(counts)) segments[outcomes[outcome]] += count;
  main.append(totals, bar(segments, summary));

  const sortedModules = [...modules].sort(([a, checksA], [b, checksB]) => {
    const failureCount = checks => checks.filter(check => outcomes[check.outcome] === "fail").length;
    return findingCount(checksB) - findingCount(checksA) || failureCount(checksB) - failureCount(checksA) || a.localeCompare(b);
  });
  for (const [moduleName, checks] of sortedModules) {
    const section = element("section");
    const name = moduleName.replace("tests.repository.quality.", "").replaceAll("test_", "").replaceAll("_", " ");
    section.append(element("h2", name));
    const moduleCounts = {pass: 0, fail: 0, skip: 0};
    for (const check of checks) moduleCounts[outcomes[check.outcome]]++;
    const description = Object.entries(moduleCounts).filter(([, count]) => count)
      .map(([status, count]) => `${format(count)} ${{pass: "passed", fail: "failed", skip: "skipped"}[status]}`).join(" · ");
    section.append(element("p", description, "counts"), bar(moduleCounts, `${name}: ${description}`));
    for (const check of checks.filter(check => check.findings !== undefined)) {
      const checkName = check.id.split(".").at(-1).replace(/^test_/, "").replaceAll("_", " ");
      section.append(element("p", `${format(check.findings)} findings · ${checkName}`, "counts"));
    }
    main.append(section);
  }

</script>
