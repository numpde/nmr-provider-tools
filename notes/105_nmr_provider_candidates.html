    "kind": "Experimental ¹H and molecular formula",
    "origin": "The NMRPeak paper reports 805,224 eligible ¹H+formula training molecules after curation, out of the separately counted total NMRPeak NMRexp corpus. Counts describe the published recipe, not independently verified exact membership of the released HF checkpoint.",
    "references": [
      {
        "text": "Paper and deployed-release audit",
        "url": "https://github.com/numpde/magnet/blob/main/notes/030_deployed_checkpoint_training_data_20261020.txt"
      },
      {
        "text": "NMRPeak paper",
        "url": "https://arxiv.org/abs/2602.08752"
      }
    ]
  },
  {
    "id": "nmrexp-nmrpeak-chf",
    "name": "NMRPeak-G CHF eligible training subset",
    "derivedFrom": "nmrexp-nmrpeak",
    "size": {
      "count": 670668,
      "unit": "training molecules"
    },
    "kind": "Experimental paired ¹H+¹³C and formula",
    "origin": "The NMRPeak paper reports 670,668 eligible paired ¹H+¹³C+formula training molecules. The published recipe does not prove exact trained-molecule membership of the released CHF checkpoint.",
    "references": [
      {
        "text": "Paper and deployed-release audit",
        "url": "https://github.com/numpde/magnet/blob/main/notes/030_deployed_checkpoint_training_data_20261020.txt"
      },
      {
        "text": "NMRPeak paper",
        "url": "https://arxiv.org/abs/2602.08752"
      }
    ]
  },
  {
    "id": "secs-inhouse-eval-34",
    "name": "SECS in-house experimental evaluation",
    "size": {
      "count": 34,
      "unit": "molecules"
    },
    "kind": "Experimental ¹H/¹³C NMR",
    "origin": "Separate held-out evaluation set of 34 molecules with experimental proton and carbon spectra; not part of the 2,370-molecule experimental fine-tuning set. The authors use it to compare simulated, augmented and experimentally fine-tuned encoders.",
    "references": [
      {
        "text": "Nature Communications 2026",
        "url": "https://doi.org/10.1038/s41467-026-73846-y"
      }
    ]
  },
  {
    "id": "secs-chemotion-eval-1486",
    "name": "SECS Chemotion experimental evaluation",
    "size": {
      "count": 1486,
      "unit": "molecules"
    },
    "kind": "Experimental ¹H NMR",
    "origin": "Held-out published Chemotion examples; includes a 323-compound subset satisfying the paper's narrow formula and ≤15-heavy-atom search constraints. Evaluation, not model training. The reported top-1 is 10.3% on the full 1,486 and 27.9% on the constrained subset.",
    "references": [
      {
        "text": "Nature Communications 2026",
        "url": "https://doi.org/10.1038/s41467-026-73846-y"
      }
    ]
  }
]
  </script>
  <script>
    "use strict";
    const methods = JSON.parse(document.getElementById("method-data").textContent);
    const datasets = JSON.parse(document.getElementById("dataset-data").textContent);
    const datasetById = new Map(datasets.map(dataset => [dataset.id, dataset]));

    function cell(row, value) {
      const td = document.createElement("td");
      td.textContent = value;
      row.append(td);
      return td;
    }

    function link(text, url) {
      const a = document.createElement("a");
      a.textContent = text;
      a.href = url;
      return a;
    }

    function links(cell, entries) {
      entries.forEach((entry, index) => {
        if (index) cell.append(document.createTextNode(" · "));
        cell.append(link(entry.text, entry.url));
      });
    }

    for (const method of methods) {
      const row = document.createElement("tr");
      cell(row, method.method);
      cell(row, method.integrated ? "✓" : "");
      cell(row, method.year);
      const authors = cell(row, method.authors ? method.authors.display : "—");
      if (method.authors) {
        authors.title = method.authors.works
          ? method.authors.works.map(work =>
              work.year + ": " + work.authors.join(", ")).join(" | ")
          : method.authors.variants
            ? method.authors.names.join(", ") + " | " +
              method.authors.variants.map(version =>
                version.label + ": " + version.names.join(", ")).join(" | ")
            : method.authors.names.join(", ");
      }
      const publications = document.createElement("td");
      links(publications, method.publications);
      row.append(publications);
      cell(row, method.description);
      const uses = document.createElement("td");
      method.datasets.forEach((use, index) => {
        if (index) uses.append(document.createTextNode(" · "));
        uses.append(link(datasetById.get(use.id).name, "#dataset-" + use.id));
        if (use.role !== "training") {
          uses.append(document.createTextNode(" (" + use.role + ")"));
        }
      });
      if (!method.datasets.length) uses.textContent = "—";
      row.append(uses);
      for (const entries of [method.code, method.checkpoints]) {
        const td = document.createElement("td");
        if (entries.length) {
          links(td, entries);
          for (const anchor of td.children) {
            const entry = entries.find(value => value.text === anchor.textContent);
            if (entry && entry.releaseVerification === "unverified") {
              anchor.textContent += " (unverified)";
              anchor.title = "Upstream README cites two conflicting Zenodo deposit IDs";
            } else if (entry && entry.codeRef) {
              anchor.title = "Requires code branch: " + entry.codeRef;
            }
          }
        } else td.textContent = "—";
        row.append(td);
      }
      for (const field of ["size", "parameters"]) {
        const td = document.createElement("td");
        const available = method.checkpoints.filter(entry => entry[field]);
        available.forEach((entry, index) => {
          if (index) td.append(document.createTextNode(" · "));
          const fact = entry[field];
          let value;
          if (field === "size") {
            const fromBytes = fact.unit === "B";
            const n = !fromBytes ? fact.value :
              fact.value >= 1e9 ? fact.value / 1e9 : fact.value / 1e6;
            const unit = !fromBytes ? fact.unit :
              fact.value >= 1e9 ? "GB" : "MB";
            value = (fact.approximate ? "≈" : "") +
              Number(n.toFixed(2)).toLocaleString("en-US") + " " + unit;
            if (fact.quantity) value += " × " + fact.quantity;
            if (fact.scope !== "checkpoint" && fact.scope !== "per checkpoint")
              value += " (" + fact.scope + ")";
          } else {
            value = fact.approximate
              ? "≈" + Number((fact.count / 1e6).toFixed(3)).toLocaleString("en-US") + "M"
              : fact.count.toLocaleString("en-US");
            if (fact.scope !== "model") value += " (" + fact.scope + ")";
          }
          td.append(document.createTextNode(entry.text + ": " + value));
        });
        if (!available.length && field === "parameters" && method.architectureFacts?.backboneParameters) {
          const fact = method.architectureFacts.backboneParameters;
          td.textContent = (fact.approximate ? "≈" : "") +
            Number((fact.count / 1e6).toFixed(3)).toLocaleString("en-US") +
            "M (" + fact.scope + "; complete model unknown)";
        } else if (!available.length) td.textContent = "—";
        row.append(td);
      }
      document.getElementById("method-rows").append(row);
    }

    for (const dataset of datasets) {
      const row = document.createElement("tr");
      row.id = "dataset-" + dataset.id;
      cell(row, dataset.name);
      const size = dataset.size
        ? (dataset.size.approximate ? "≈" : "") +
          dataset.size.count.toLocaleString("en-US") + " " + dataset.size.unit +
          (dataset.size.asOf ? " (" + dataset.size.asOf + ")" : "")
        : "—";
      cell(row, size);
      cell(row, dataset.kind);
      const origin = cell(row, dataset.origin);
      if (dataset.derivedFrom) {
        origin.append(document.createTextNode(" Source: "));
        origin.append(link(datasetById.get(dataset.derivedFrom).name, "#dataset-" + dataset.derivedFrom));
      }
      const references = document.createElement("td");
      links(references, dataset.references);
      row.append(references);
      document.getElementById("dataset-rows").append(row);
    }
  </script>
</body>
</html>
