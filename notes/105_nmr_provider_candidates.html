  <script>
    "use strict";
    const providers = JSON.parse(document.getElementById("provider-data").textContent);
    const datasets = JSON.parse(document.getElementById("dataset-data").textContent);
    const datasetById = new Map(datasets.map(dataset => [dataset.id, dataset]));

    function cell(row, value) {
      const td = document.createElement("td");
      td.textContent = value;
      row.append(td);
      return td;
    }

    function link(text, url) {
      const a = document.createElement("a");
      a.textContent = text;
      a.href = url;
      return a;
    }

    function links(cell, entries) {
      entries.forEach((entry, index) => {
        if (index) cell.append(document.createTextNode(" · "));
        cell.append(link(entry.text, entry.url));
      });
    }

    for (const provider of providers) {
      const row = document.createElement("tr");
      cell(row, provider.provider);
      cell(row, provider.year);
      const publications = document.createElement("td");
      links(publications, provider.publications);
      row.append(publications);
      cell(row, provider.method);
      const uses = document.createElement("td");
      provider.datasets.forEach((use, index) => {
        if (index) uses.append(document.createTextNode(" · "));
        uses.append(link(datasetById.get(use.id).name, "#dataset-" + use.id));
        if (use.role !== "training") {
          uses.append(document.createTextNode(" (" + use.role + ")"));
        }
      });
      row.append(uses);
      document.getElementById("provider-rows").append(row);
    }

    for (const dataset of datasets) {
      const row = document.createElement("tr");
      row.id = "dataset-" + dataset.id;
      cell(row, dataset.name);
      const size = (dataset.size.approximate ? "≈" : "") +
        dataset.size.count.toLocaleString("en-US") + " " + dataset.size.unit +
        (dataset.size.asOf ? " (" + dataset.size.asOf + ")" : "");
      cell(row, size);
      cell(row, dataset.kind);
      const origin = cell(row, dataset.origin);
      if (dataset.derivedFrom) {
        origin.append(document.createTextNode(" Source: "));
        origin.append(link(datasetById.get(dataset.derivedFrom).name, "#dataset-" + dataset.derivedFrom));
      }
      const references = document.createElement("td");
      links(references, dataset.references);
      row.append(references);
      document.getElementById("dataset-rows").append(row);
    }
  </script>
