# Scientific choices and execution policy for this local mock deployment.
[execution.embedded_host]
# Across accepted calls, cap total encoded input bytes and reserved result bytes.
# Caller-held operation handles can still retain completed input bytes.
# For larger inputs or reports, replace either value:
# input_bytes = 131072
# result_bytes = 65536
input_bytes = 32768
result_bytes = 32768
# Allow space for this many scientific state values, such as prepared inputs.
# To retain more preparations, replace state_values:
# state_values = 8
state_values = 2
# Keep the latest progress updates for each operation; discard older updates.
# To keep more updates, replace progress_records:
# progress_records = 32
progress_records = 1
# Request a stop if model initialization takes this many seconds.
# The Python thread can continue running after the request.
# For a slower loader, replace initialization_seconds:
# initialization_seconds = 60
initialization_seconds = 5
# Mark provider cleanup overdue after this many seconds; cleanup continues.
# For slower cleanup, replace retirement_seconds:
# retirement_seconds = 30
retirement_seconds = 5

[execution.operation_policy]
# Apply these rules separately to each submitted prepare or generate call.
# Ask the call to stop if it waits this long after the SDK accepts it.
queue_stop_request_seconds = 5
# Start this clock when the SDK allows the call to enter scientific work.
# Count model loading, input decoding, science and result encoding.
# Expiry requests a stop; it does not force the Python thread to exit.
# For slower science, replace execution_stop_request_seconds:
# execution_stop_request_seconds = 60
execution_stop_request_seconds = 5
# Start this clock when result release or analysis cleanup begins.
# If cleanup remains unfinished, expose an overdue flag and keep cleaning up.
cleanup_overdue_flag_seconds = 5
# Count bytes after encoding. Reject oversized input before starting the call.
# For larger inputs, replace reject_encoded_input_over_bytes:
# reject_encoded_input_over_bytes = 16384
reject_encoded_input_over_bytes = 8192
# Reserve this much result space before starting; fail if the encoded result
# exceeds it after the scientific method has run. Exactly this size is allowed.
reject_encoded_result_over_bytes = 8192

# Declare what each offering needs; the SDK does not reserve or pin hardware.
# Run the provider in an environment that can meet these requirements.
# To request two CPU threads, replace amount:
# amount = 2
[[execution.resource_requirement]]
kind = "cpu"
amount = 1
unit = "thread"
selector = "generic"

# Each offering selects its accepted checkpoint and scientific behaviour.
[science.hf.settings]
checkpoint_sha256 = "f0cd7060781da0663e8ab6f8ed9df357b5acae8528f349291e8f4cc6a9721825"
maximum_input_tokens = 64
beam_size = 2
maximum_candidate_characters = 64

[science.chf.settings]
checkpoint_sha256 = "367c6761437cd17944e812e2d91425f356fc8238be4b4f7c917b2368167fa9f3"
maximum_input_tokens = 64
beam_size = 2
maximum_candidate_characters = 64
