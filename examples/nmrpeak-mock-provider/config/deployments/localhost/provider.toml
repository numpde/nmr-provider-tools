# Provider startup reads this file to configure HF/CHF science and SDK execution.
[execution.in_process_execution_host]
# Across scientific-method submissions, cap total encoded input bytes and
# reserved result space. Saved operation handles can retain completed input bytes.
# For larger inputs or reports, replace either value:
# input_bytes = 131072
# result_bytes = 65536
input_bytes = 32768
result_bytes = 32768
# Reserve space for this many intermediate scientific values, such as prepared inputs.
# To retain more preparations, replace state_values:
# state_values = 8
state_values = 2
# Keep this many recent progress updates per submitted method; discard older ones.
# To keep more updates, replace progress_records:
# progress_records = 32
progress_records = 1
# The SDK requests a stop if the scientific object's initialize method takes
# this many seconds. The Python thread can continue running after the request.
# For a slower loader, replace initialization_seconds:
# initialization_seconds = 60
initialization_seconds = 5
# When provider code calls host.retire(), mark unfinished SDK cleanup overdue
# after this many seconds. Cleanup continues.
# For slower cleanup, replace retirement_seconds:
# retirement_seconds = 30
retirement_seconds = 5

[execution.operation_policy]
# This mock provider asks the SDK to validate proposed spectrum data.
# When validation succeeds, it asks the SDK to generate candidate structures.
# Apply these rules separately to each validation and generation request.
# If requested work waits this long to start, the SDK requests a stop.
queue_stop_request_seconds = 5
# Once execution confirms the request is not stopped or past its start deadline,
# count model loading, input checking, running
# the science and converting its result to bytes. After this many seconds,
# request a stop; the running Python code may continue.
# For slower science, replace execution_stop_request_seconds:
# execution_stop_request_seconds = 60
execution_stop_request_seconds = 5
# This allowance covers release of a validation report or an accepted generation
# report, and cleanup when leaving a prediction context closes its execution.
# Mark unfinished cleanup overdue after this many seconds and keep cleaning up.
# This example keeps waiting; the overdue flag does not print a warning by itself.
cleanup_overdue_flag_seconds = 5
# Measure input size after converting it to bytes. If it exceeds this size,
# refuse the request before starting the scientific work.
# For larger inputs, replace reject_encoded_input_over_bytes:
# reject_encoded_input_over_bytes = 16384
reject_encoded_input_over_bytes = 8192
# Before starting work, count this many result bytes against the total budget above.
# If the result exceeds this size after conversion to bytes, fail the request;
# the scientific work has already happened. Exactly this size is allowed.
reject_encoded_result_over_bytes = 8192

# Resource needs declared for checking spectrum data and generating candidates.
# Whoever runs the provider must make these resources available; declaring them
# here does not reserve hardware or pin work to particular processors.
# To request two CPU threads, replace amount:
# amount = 2
[[execution.resource_requirement]]
kind = "cpu"
amount = 1
unit = "thread"
selector = "generic"

# Each array entry enables one configured model of that scientific input family.
# Omit a family to disable it; repeat its entry to offer another model or settings.
# Configure HF and CHF separately. Before loading, check each checkpoint's
# contents against the expected digest. Limit the number of input tokens,
# generated candidates and characters in each candidate string.
# Checkpoint paths are relative to this deployment document.
[[science.hf]]
checkpoint_path = "../../../models/hf.json"

# Static shares for an independent process host. Their sums must fit the
# provider's aggregate input/result/state allowances above. Threads share those
# aggregate allowances directly. Progress history remains a per-operation limit.
[science.hf.process_capacity]
input_bytes = 16384
result_bytes = 16384
state_values = 1

[science.hf.settings]
checkpoint_sha256 = "7c7f0d3b27d2a7ae2768883f42daaab9c9b6d813f8cae36f6e6a8d487f813975"
maximum_input_tokens = 64
beam_size = 2
maximum_candidate_characters = 64

[[science.chf]]
checkpoint_path = "../../../models/chf.json"

[science.chf.process_capacity]
input_bytes = 16384
result_bytes = 16384
state_values = 1

[science.chf.settings]
checkpoint_sha256 = "3f8a1d4186f324d399ff395482762da65517d52a68e5157481f9bdff944c627e"
maximum_input_tokens = 64
beam_size = 2
maximum_candidate_characters = 64

# Each prediction gets its own interpretation session. Startup supplies the
# ordered endpoint services; these settings govern their use for that request.
[interpreter]
# Allow this much time across all models. Already admitted preparation can finish
# after the budget expires; the SDK does not start replacement work because of it.
interpretation_budget_seconds = 15
# Reject a model turn if its combined messages and tool definitions, encoded as
# compact ASCII JSON including their envelope, exceed this many bytes.
reject_combined_messages_and_tools_over_bytes = 32768
# Each model gets its own limits. Rejected proposals, invalid tool arguments
# and otherwise valid responses without exactly one tool call count as
# rejections. Reaching either limit ends that model's visit.
end_model_visit_after_turns = 12
end_model_visit_after_rejections = 3
# The total includes the initial HTTP attempt. Only retryable failures can retry,
# and the model's remaining time may permit fewer attempts than this limit.
total_http_attempts_per_turn = 2
# Apply this connection timeout to each model endpoint exchange.
connection_timeout_seconds = 10
# Across model visits, retain captured records within both limits. Evict oldest
# records as necessary; omit a record that alone exceeds the byte limit.
retain_history_up_to_bytes = 1048576
retain_history_up_to_records = 48
