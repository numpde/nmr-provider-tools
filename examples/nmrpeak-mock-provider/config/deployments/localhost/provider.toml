# Local mock deployment policy. Scientific model settings remain in settings.toml.
[execution.embedded_host]
# In-flight input and owned result capacity, measured in bytes.
# Retained caller handles can still contain completed request bytes.
# For larger spectra or reports, replace either budget independently:
# input_bytes = 131072
# result_bytes = 65536
input_bytes = 32768
result_bytes = 32768
# Retain validated scientific inputs and bounded progress history.
# More retained preparations require a larger state budget:
# state_values = 8
# A method that emits progress can retain more of its history:
# progress_records = 32
state_values = 2
progress_records = 1
# Loading and retirement allowances, measured in seconds.
# For a slower checkpoint loader or cleanup, replace the relevant allowance:
# initialization_seconds = 60
# retirement_seconds = 30
# Expiry is observable; it does not forcibly stop an executor thread.
initialization_seconds = 5
retirement_seconds = 5

[execution.operation_policy]
# Policy for each submitted operation, not total host capacity.
# Queue time starts when the SDK accepts the call.
# Execution time starts at guarded dispatch.
# Queue/execution expiry requests stopping but does not prove work has exited.
# For slower science, replace execution_stop_request_seconds below:
# execution_stop_request_seconds = 60
queue_stop_request_seconds = 5
execution_stop_request_seconds = 5
# Flag unfinished cleanup after this many seconds; do not cancel it.
cleanup_overdue_flag_seconds = 5
# Maximum encoded input and result size for one operation, measured in bytes.
# For larger inputs, replace reject_encoded_input_over_bytes below:
# reject_encoded_input_over_bytes = 16384
reject_encoded_input_over_bytes = 8192
reject_encoded_result_over_bytes = 8192

# Resource requirements requested for each offering, not granted capacity.
# To request two CPU threads, replace amount below:
# amount = 2
# This declares a requirement. EmbeddedHost does not discover, reserve or pin
# hardware; the environment running the provider must satisfy it.
[[execution.resource_requirement]]
kind = "cpu"
amount = 1
unit = "thread"
selector = "generic"
