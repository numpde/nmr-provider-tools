[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nmrpeak-mock-provider-example"
version = "0.1.0"
description = "NMRPeak-shaped scientific hosting with lightweight model and service stand-ins"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["provider-core[api]==0.6.19"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nmrpeak_mock_provider", "nmrpeak_mock_provider.*"]
namespaces = false

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
nmrpeak_mock_provider = ["*.json", "interpreter.md"]
