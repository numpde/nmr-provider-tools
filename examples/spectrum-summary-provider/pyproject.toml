[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrum-summary-provider-example"
version = "0.1.0"
description = "Configured spectrum contributions with independent execution orchestration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["provider-core==0.6.19"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["spectrum_provider", "spectrum_provider.*"]
namespaces = false

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
spectrum_provider = ["settings.toml", "resources.toml"]
