[execution]
backend = "thread"

# Capacity for scientific execution in this deployment.
[execution.host]
input_bytes = 8192
result_bytes = 8192
state_values = 2
progress_records = 1
initialization_seconds = 5
retirement_seconds = 5

# Apply these allowances separately to each submitted scientific method.
[execution.operation_policy]
queue_stop_request_seconds = 5
execution_stop_request_seconds = 10
cleanup_overdue_flag_seconds = 5
reject_encoded_input_over_bytes = 4096
reject_encoded_result_over_bytes = 4096

# Declared CPU needs; the operator must make this capacity available.
[[execution.resource_requirement]]
kind = "cpu"
amount = 1
unit = "thread"
selector = "generic"
exclusive = false

# Scientific settings stay in provider-owned records.
[science.baseline.settings]
baseline = 1.0

[science.peaks.settings]
minimum_height = 2.0

# Static shares of the enclosing execution capacity, identical on both backends.
# The SDK requires one state slot per host even though neither stage emits state.
[execution.stage_capacity.baseline]
input_bytes = 4096
result_bytes = 4096
state_values = 1

[execution.stage_capacity.peaks]
input_bytes = 4096
result_bytes = 4096
state_values = 1
